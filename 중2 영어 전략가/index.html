<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중2 영어 전략가</title><style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Outfit:wght@400;600;700&display=swap');:root{--ink:#172f43;--blue:#dcebf5;--bg:#f7f8f5;--line:#d8e2e5;--mint:#bdebd8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Gowun Dodum',sans-serif}.wrap{max-width:760px;margin:auto;padding:38px 22px 70px}.hero{background:var(--ink);color:white;padding:30px;border-radius:20px;position:relative;overflow:hidden}.hero:after{content:'?';position:absolute;right:28px;top:-33px;font:150px Outfit;color:var(--mint)}.eyebrow{font:11px Outfit;letter-spacing:.1em;color:#7595a7}.hero h1{font:600 34px/1.15 Outfit;margin:8px 0}.hero p{font-size:13px;line-height:1.7;color:#d4e0e8;margin:0}.card{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}.card h2{font:600 22px Outfit;margin:0 0 8px}.small{font-size:12px;color:#5d707b;line-height:1.65}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:20px 0}.step{border-top:3px solid #c4d7dd;padding-top:8px;font-size:11px;color:#537182}.step b{display:block;color:var(--ink);font-size:13px;margin-top:3px}button{font-family:inherit;border:0;border-radius:9px;cursor:pointer}.go{background:var(--ink);color:white;padding:13px 18px;font-size:14px;width:100%}.go span{color:var(--mint);font-size:18px;margin-left:5px}.prep{display:grid;gap:10px}.prep label{font-size:12px;color:#3d5b69}.prep input,.prep textarea{font:13px 'Gowun Dodum';width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:8px;resize:vertical}.save{background:#bdebd8;color:#173d36;padding:11px;font-size:13px}.report{background:#eaf3f7}.report b{font-family:Outfit;font-size:16px}.toast{font-size:12px;color:#397263;height:20px;margin-top:8px}dialog{border:0;border-radius:18px;padding:25px;width:min(550px,calc(100% - 28px));color:var(--ink)}dialog::backdrop{background:#17334688}.bar{height:6px;background:#e4ebed;border-radius:5px}.bar i{display:block;height:100%;background:#61a58f;border-radius:5px;width:25%;transition:.2s}.qno{font:11px Outfit;color:#59798a;margin-top:20px}.question{font:600 23px/1.4 Outfit;margin:8px 0 20px}.answers{display:grid;gap:8px}.answer{background:#fff;border:1px solid var(--line);padding:12px;text-align:left;font-size:14px}.answer.ok{background:#e0f5e9;border-color:#62a87f}.answer.no{background:#fff0e9;border-color:#e1a27a}.hint{min-height:35px;color:#536d78;font-size:12px;margin:12px 0}.next{background:var(--ink);color:white;padding:11px 17px;float:right}.next:disabled{opacity:.35}@media(max-width:460px){.steps{grid-template-columns:1fr 1fr}.hero h1{font-size:30px}}
</style></head><body><main class="wrap"><section class="hero"><p class="eyebrow">SATURDAY RECAP · MIDDLE SCHOOL 2</p><h1>중2 영어 전략가</h1><p>답을 고르기 전에 근거를 찾고,<br>반복되는 실수를 줄이는 30분입니다.</p></section><section class="card"><p class="eyebrow">TODAY'S MISSION</p><h2>문장 안에서 정답의 근거를 찾자</h2><p class="small">맞았는지보다 “왜 그 답인지” 설명할 수 있는지가 더 중요합니다.</p><div class="steps"><div class="step">0–5분<b>진단</b></div><div class="step">5–12분<b>단어</b></div><div class="step">12–23분<b>문법·독해</b></div><div class="step">23–30분<b>오답 분석</b></div></div><button class="go" id="start">리캡 시작하기 <span>→</span></button></section><section class="card"><p class="eyebrow">THIS WEEK'S NOTES</p><h2>이번 주 배움 담기</h2><form class="prep" id="form"><label>단원<input id="unit" value="문장 성분과 시제"></label><label>핵심 단어 <small>(쉼표로 구분)</small><textarea id="words" rows="2">yesterday, interesting, finish, although</textarea></label><label>어려웠던 점<textarea id="hard" rows="2">문장을 끝까지 읽기 전에 답을 고르는 실수가 있어요</textarea></label><button class="save">저장하기</button></form><div class="toast" id="toast"></div></section><section class="card report"><p class="eyebrow">PARENT NOTE</p><b>이번 주 리캡 결과</b><p class="small" id="summary">리캡을 마치면 이곳에 짧은 부모님 요약이 생성됩니다.</p></section></main><dialog id="quiz"><div class="bar"><i id="bar"></i></div><p class="qno" id="number"></p><h2 class="question" id="question"></h2><div class="answers" id="answers"></div><p class="hint" id="hint"></p><button class="next" id="next" disabled>다음 →</button></dialog><script>
const questions=[['다음 중 현재완료와 가장 잘 어울리는 단서는?',['already','yesterday','last year'],0,'already는 “이미”라는 뜻으로 현재완료와 자주 함께 써.'],['빈칸에 알맞은 것은? Jina ___ already finished her project.',['has','have','did'],0,'Jina는 한 명이므로 has를 사용해.'],['다음 중 어법상 알맞은 문장은?',['I have met him yesterday.','I met him yesterday.','I have met him last week.'],1,'yesterday처럼 끝난 과거 시점이 있으면 과거형을 써.'],['글의 중심 내용으로 알맞은 것은? “Students have shared books they already read with classmates.”',['학급의 책 나눔 활동','새 책을 사는 방법','도서관 이용 시간'],0,'누가 무엇을 했는지 한 문장으로 요약해 봐.']];let n=0,score=0,picked=false;const $=s=>document.querySelector(s),quiz=$('#quiz');function draw(){let q=questions[n];picked=false;$('#bar').style.width=(n+1)*25+'%';$('#number').textContent=`${n+1} / 4`;$('#question').textContent=q[0];$('#hint').textContent='';$('#next').disabled=true;$('#next').textContent=n===3?'결과 보기 →':'다음 →';$('#answers').innerHTML=q[1].map((x,i)=>`<button class="answer" data-i="${i}">${x}</button>`).join('');document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(b,+b.dataset.i))}function answer(b,i){if(picked)return;picked=true;let q=questions[n],ok=i===q[2];document.querySelectorAll('.answer').forEach((x,j)=>{x.disabled=true;if(j===q[2])x.classList.add('ok');if(j===i&&!ok)x.classList.add('no')});if(ok)score++;else $('#hint').textContent='힌트 · '+q[3];$('#next').disabled=false}$('#start').onclick=()=>{n=score=0;draw();quiz.showModal()};$('#next').onclick=()=>{if(n<3){n++;draw()}else{quiz.close();$('#summary').textContent=`오늘 4문제 중 ${score}문제를 정확히 확인했습니다. 시제 단서와 문법 근거를 연결하는 힘이 좋습니다. already와 yesterday의 차이를 다음 주에 5분 더 점검해 주세요.`;localStorage.setItem('middleRecap',JSON.stringify({score,date:new Date().toISOString()}))}};$('#form').onsubmit=e=>{e.preventDefault();localStorage.setItem('middlePrep',JSON.stringify({unit:$('#unit').value,words:$('#words').value,hard:$('#hard').value}));$('#toast').textContent='이번 주 학습 자료를 저장했어요 ✓';setTimeout(()=>$('#toast').textContent='',1800)};
</script><script src="adaptive.js"></script><script src="question-engine.js"></script></body></html>
