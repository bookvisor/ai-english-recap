<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>초4 영어 탐험가</title><style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Outfit:wght@400;600;700&display=swap');:root{--ink:#193628;--lime:#d8f34d;--bg:#faf7ef;--line:#dce6d7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Gowun Dodum',sans-serif}.wrap{max-width:760px;margin:auto;padding:38px 22px 70px}.hero{background:var(--ink);color:white;padding:30px;border-radius:20px;position:relative;overflow:hidden}.hero:after{content:'✦';position:absolute;right:25px;top:-20px;font:120px Outfit;color:var(--lime);opacity:.9}.eyebrow{font:11px Outfit;letter-spacing:.1em;color:#8fb185}.hero h1{font:600 34px/1.15 Outfit;margin:8px 0}.hero p{font-size:13px;line-height:1.7;color:#d8e3d7;margin:0}.card{margin-top:18px;background:#fffdf8;border:1px solid var(--line);border-radius:16px;padding:24px}.card h2{font:600 22px Outfit;margin:0 0 8px}.small{font-size:12px;color:#63766b;line-height:1.65}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:20px 0}.step{border-top:3px solid #bed2b4;padding-top:8px;font-size:11px;color:#587060}.step b{display:block;color:var(--ink);font-size:13px;margin-top:3px}button{font-family:inherit;border:0;border-radius:9px;cursor:pointer}.go{background:var(--ink);color:white;padding:13px 18px;font-size:14px;width:100%}.go span{color:var(--lime);font-size:18px;margin-left:5px}.prep{display:grid;gap:10px}.prep label{font-size:12px;color:#45624e}.prep input,.prep textarea{font:13px 'Gowun Dodum';width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:8px;resize:vertical}.save{background:#d9ef76;color:#264126;padding:11px;font-size:13px}.report{background:#eef6e8}.report b{font-family:Outfit;font-size:16px}.toast{font-size:12px;color:#527b4c;height:20px;margin-top:8px}dialog{border:0;border-radius:18px;padding:25px;width:min(550px,calc(100% - 28px));color:var(--ink)}dialog::backdrop{background:#17342688}.bar{height:6px;background:#e4ebdf;border-radius:5px}.bar i{display:block;height:100%;background:#86ac59;border-radius:5px;width:25%;transition:.2s}.qno{font:11px Outfit;color:#688064;margin-top:20px}.question{font:600 23px/1.4 Outfit;margin:8px 0 20px}.answers{display:grid;gap:8px}.answer{background:#fff;border:1px solid var(--line);padding:12px;text-align:left;font-size:14px}.answer.ok{background:#eaf7dd;border-color:#78a657}.answer.no{background:#fff0e9;border-color:#e0a077}.hint{min-height:35px;color:#61745d;font-size:12px;margin:12px 0}.next{background:var(--ink);color:white;padding:11px 17px;float:right}.next:disabled{opacity:.35}@media(max-width:460px){.steps{grid-template-columns:1fr 1fr}.hero h1{font-size:30px}}
</style></head><body><main class="wrap"><section class="hero"><p class="eyebrow">SATURDAY RECAP · ELEMENTARY 4</p><h1>초4 영어 탐험가</h1><p>이번 주 배운 영어를 즐겁게 꺼내 보고,<br>내 문장으로 말해 보는 30분이에요.</p></section><section class="card"><p class="eyebrow">TODAY'S MISSION</p><h2>음식과 취향을 영어로 말해 볼까?</h2><p class="small">정답을 급하게 고르기보다, 힌트를 보고 한 번 더 생각해 봐요.</p><div class="steps"><div class="step">0–5분<b>워밍업</b></div><div class="step">5–12분<b>단어</b></div><div class="step">12–23분<b>문장</b></div><div class="step">23–30분<b>정리</b></div></div><button class="go" id="start">리캡 시작하기 <span>→</span></button></section><section class="card"><p class="eyebrow">THIS WEEK'S NOTES</p><h2>이번 주 배움 담기</h2><form class="prep" id="form"><label>단원<input id="unit" value="음식과 취향"></label><label>새 단어 <small>(쉼표로 구분)</small><textarea id="words" rows="2">delicious, hungry, favorite, menu</textarea></label><label>어려웠던 점<textarea id="hard" rows="2">favorite 철자가 헷갈려요</textarea></label><button class="save">저장하기</button></form><div class="toast" id="toast"></div></section><section class="card report"><p class="eyebrow">PARENT NOTE</p><b>이번 주 리캡 결과</b><p class="small" id="summary">리캡을 마치면 이곳에 짧은 부모님 요약이 생성됩니다.</p></section></main><dialog id="quiz"><div class="bar"><i id="bar"></i></div><p class="qno" id="number"></p><h2 class="question" id="question"></h2><div class="answers" id="answers"></div><p class="hint" id="hint"></p><button class="next" id="next" disabled>다음 →</button></dialog><script>
const questions=[['“classroom”의 뜻으로 알맞은 것은?',['교실','숙제','선생님'],0,'학교에서 친구들과 수업을 듣는 장소를 떠올려 봐.'],['빈칸에 알맞은 말은? I ___ do my homework after dinner.',['usually','teacher','classroom'],0,'“보통, 대개”라는 뜻의 단어야.'],['다음 중 자연스러운 문장은?',['My teacher is kind.','My teacher are kind.','My teacher kind.'],0,'My teacher는 한 명이므로 is가 필요해.'],['“I do my homework after dinner.”의 뜻은?',['나는 저녁 식사 후 숙제를 한다.','나는 숙제 전에 저녁을 먹는다.','나는 교실에서 저녁을 먹는다.'],0,'after dinner는 “저녁 식사 후”라는 뜻이야.']];let n=0,score=0,picked=false;const $=s=>document.querySelector(s),quiz=$('#quiz');function draw(){let q=questions[n];picked=false;$('#bar').style.width=(n+1)*25+'%';$('#number').textContent=`${n+1} / 4`;$('#question').textContent=q[0];$('#hint').textContent='';$('#next').disabled=true;$('#next').textContent=n===3?'결과 보기 →':'다음 →';$('#answers').innerHTML=q[1].map((x,i)=>`<button class="answer" data-i="${i}">${x}</button>`).join('');document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(b,+b.dataset.i))}function answer(b,i){if(picked)return;picked=true;let q=questions[n],ok=i===q[2];document.querySelectorAll('.answer').forEach((x,j)=>{x.disabled=true;if(j===q[2])x.classList.add('ok');if(j===i&&!ok)x.classList.add('no')});if(ok)score++;else $('#hint').textContent='힌트 · '+q[3];$('#next').disabled=false}$('#start').onclick=()=>{n=score=0;draw();quiz.showModal()};$('#next').onclick=()=>{if(n<3){n++;draw()}else{quiz.close();$('#summary').textContent=`오늘 4문제 중 ${score}문제를 정확히 확인했어요. 학교와 일상 단어를 문장으로 연결하는 힘이 좋습니다. usually와 homework를 다음 주에 5분만 더 복습해 주세요.`;localStorage.setItem('elementaryRecap',JSON.stringify({score,date:new Date().toISOString()}))}};$('#form').onsubmit=e=>{e.preventDefault();localStorage.setItem('elementaryPrep',JSON.stringify({unit:$('#unit').value,words:$('#words').value,hard:$('#hard').value}));$('#toast').textContent='이번 주 학습 자료를 저장했어요 ✓';setTimeout(()=>$('#toast').textContent='',1800)};
</script><script src="adaptive.js"></script><script src="question-engine.js"></script></body></html>
